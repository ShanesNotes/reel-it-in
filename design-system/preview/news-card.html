<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg1);padding:24px 30px;-webkit-font-smoothing:antialiased}
  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:5px;padding:22px 22px 24px;position:relative;overflow:hidden;max-width:340px;box-shadow:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.04)}
  .card::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--accent-2)}
  .src{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
  .head{font-family:var(--sans);font-weight:700;font-size:20px;line-height:1.22;margin:11px 0 13px;letter-spacing:-.01em}
  .why{font-family:var(--sans);font-size:14px;color:var(--fg2);line-height:1.5}
  .why b{color:var(--fg1);font-weight:600}
  .read{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);text-decoration:none;margin-top:15px;display:inline-flex;gap:7px}
</style></head>
<body>
  <article class="card">
    <span class="src">Google I/O 2026</span>
    <h3 class="head">Google halved the price of its top AI — and gave it the power to do things for you</h3>
    <p class="why"><b>Why it matters:</b> A capable assistant just got much cheaper and can now act on your behalf — book, browse, buy.</p>
    <a class="read" href="#">Read the story →</a>
  </article>
</body></html>
