<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg1);padding:20px 30px;-webkit-font-smoothing:antialiased}
  .arc-row{display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line-soft)}
  .arc-num{font-family:var(--mono);font-size:12px;color:var(--accent-deep);letter-spacing:.08em}
  .arc-title{font-family:var(--serif);font-size:20px;line-height:1.2}
  .arc-tags{font-family:var(--mono);font-size:11px;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
  .arc-date{font-family:var(--mono);font-size:12px;color:var(--fg3);white-space:nowrap}
</style></head>
<body>
  <div class="arc-row">
    <div class="arc-num">EP 000</div>
    <div><div class="arc-title">The test run that started it all</div><div class="arc-tags">Myth & Machine · Under the Hood</div></div>
    <div class="arc-date">May 22, 2026</div>
  </div>
  <div class="arc-row">
    <div class="arc-num">EP 001</div>
    <div><div class="arc-title">The Pilot</div><div class="arc-tags">The Big One · The State · Where It Lives</div></div>
    <div class="arc-date">May 29, 2026</div>
  </div>
</body></html>
