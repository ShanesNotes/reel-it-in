<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg1);padding:24px 30px;-webkit-font-smoothing:antialiased}
  .ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:0;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .stop{height:62px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
  .n{font-family:var(--mono);font-size:9px;letter-spacing:.04em}
  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-bottom:12px}
</style></head>
<body>
  <div class="lbl">Gold ramp · 50 → 900 · brand = 500, deep = 700</div>
  <div class="ramp">
    <div class="stop" style="background:var(--gold-50)"><span class="n" style="color:#7A5B1A">50</span></div>
    <div class="stop" style="background:var(--gold-100)"><span class="n" style="color:#7A5B1A">100</span></div>
    <div class="stop" style="background:var(--gold-200)"><span class="n" style="color:#5E3F11">200</span></div>
    <div class="stop" style="background:var(--gold-300)"><span class="n" style="color:#3C280B">300</span></div>
    <div class="stop" style="background:var(--gold-400)"><span class="n" style="color:#3C280B">400</span></div>
    <div class="stop" style="background:var(--gold-500)"><span class="n" style="color:#FAF2E1">500</span></div>
    <div class="stop" style="background:var(--gold-600)"><span class="n" style="color:#FAF2E1">600</span></div>
    <div class="stop" style="background:var(--gold-700)"><span class="n" style="color:#FAF2E1">700</span></div>
    <div class="stop" style="background:var(--gold-800)"><span class="n" style="color:#FAF2E1">800</span></div>
    <div class="stop" style="background:var(--gold-900)"><span class="n" style="color:#FAF2E1">900</span></div>
  </div>
</body></html>
