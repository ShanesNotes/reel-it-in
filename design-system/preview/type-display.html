<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg1);padding:26px 30px;-webkit-font-smoothing:antialiased}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:14px}
  .mark{font-family:var(--serif);font-weight:600;font-size:84px;line-height:.86;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
  .mark .it{font-style:italic;font-weight:500;color:var(--accent);font-variation-settings:"opsz" 144,"WONK" 1}
  .cap{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-top:16px}
</style></head>
<body>
  <div class="kick">A father–son conversation about A.I.</div>
  <div class="mark">Reel<span class="it"> It</span> In</div>
  <div class="cap">Fraunces 600 · opsz 144 · gold italic "It" with WONK axis</div>
</body></html>
