<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg1);padding:22px 30px;-webkit-font-smoothing:antialiased}
  .row{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:none}
  .tok{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--fg3);width:130px;flex-shrink:0}
  .spec{font-family:var(--serif);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sans{font-family:var(--sans)}
</style></head>
<body>
  <div class="row"><span class="tok">display · 64–168</span><span class="spec" style="font-size:54px;font-variation-settings:'opsz' 144;font-weight:600">Reel It In</span></div>
  <div class="row"><span class="tok">3xl · 34–64</span><span class="spec" style="font-size:40px;font-weight:600">The Conversation</span></div>
  <div class="row"><span class="tok">2xl · 26–40</span><span class="spec" style="font-size:30px;font-weight:600">This Week</span></div>
  <div class="row"><span class="tok">xl · 22–28</span><span class="spec" style="font-size:25px;font-weight:500">Is anybody home?</span></div>
  <div class="row"><span class="tok">lg · 19–24</span><span class="spec" style="font-size:21px">No jargon survives this table.</span></div>
  <div class="row"><span class="tok">base · 16</span><span class="spec sans" style="font-size:16px">Why it matters — the only question.</span></div>
  <div class="row"><span class="tok">sm/xs · 13/11</span><span class="spec sans" style="font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)">Episode 001 · Pilot</span></div>
</body></html>
