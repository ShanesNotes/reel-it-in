<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg1);padding:26px 30px;-webkit-font-smoothing:antialiased}
  .row{display:flex;align-items:center;gap:14px;padding:6px 0}
  .bar{height:16px;background:var(--accent);border-radius:2px;opacity:.85}
  .nm{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg1);width:46px}
  .v{font-family:var(--mono);font-size:11px;color:var(--fg3)}
</style></head>
<body>
  <div class="row"><span class="nm">sp-1</span><div class="bar" style="width:6px"></div><span class="v">6px</span></div>
  <div class="row"><span class="nm">sp-2</span><div class="bar" style="width:10px"></div><span class="v">10px</span></div>
  <div class="row"><span class="nm">sp-3</span><div class="bar" style="width:14px"></div><span class="v">14px</span></div>
  <div class="row"><span class="nm">sp-4</span><div class="bar" style="width:18px"></div><span class="v">18px</span></div>
  <div class="row"><span class="nm">sp-5</span><div class="bar" style="width:24px"></div><span class="v">24px</span></div>
  <div class="row"><span class="nm">sp-6</span><div class="bar" style="width:34px"></div><span class="v">34px</span></div>
  <div class="row"><span class="nm">sp-7</span><div class="bar" style="width:48px"></div><span class="v">48px</span></div>
  <div class="row"><span class="nm">sp-8</span><div class="bar" style="width:64px"></div><span class="v">64px · section padding</span></div>
</body></html>
