<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg1);padding:24px 30px;-webkit-font-smoothing:antialiased}
  .spark{background:var(--surface);border:1px solid var(--line-soft);border-radius:5px;padding:28px 26px;position:relative;overflow:hidden;max-width:360px;box-shadow:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.04)}
  .idx{position:absolute;top:-10px;right:8px;font-family:var(--serif);font-weight:600;font-size:88px;line-height:1;color:var(--fg1);opacity:.05;font-variation-settings:"opsz" 144}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-deep);display:block;margin-bottom:15px;position:relative}
  .prompt{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.22;letter-spacing:-.01em;position:relative;text-wrap:balance}
  .aside{font-family:var(--sans);font-size:14px;color:var(--fg3);margin-top:15px;line-height:1.45;position:relative}
</style></head>
<body>
  <div class="spark">
    <span class="idx">01</span>
    <span class="tag">The Big One</span>
    <p class="prompt">Is anybody home in there? Is it actually thinking?</p>
    <p class="aside">My honest take: no — a brilliant mirror, not a mind. So why does the line feel like it's blurring?</p>
  </div>
</body></html>
